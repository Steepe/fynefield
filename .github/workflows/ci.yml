name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    env:
      CI_ENVIRONMENT: testing

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, sqlite3
          # phpunit.dist.xml produces coverage reports and treats a missing
          # driver as a warning; preserve that quality check in CI.
          coverage: xdebug

      - name: Validate Composer files
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint application PHP
        run: find app tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run test suite
        run: vendor/bin/phpunit --colors=always --log-junit build/logs/junit.xml

      - name: Upload PHPUnit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-report-php-${{ matrix.php }}
          path: build/logs/
          if-no-files-found: ignore
