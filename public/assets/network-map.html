<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Hanken Grotesk',sans-serif}
svg{display:block;width:100%;height:100%}
.flow{stroke-dasharray:4 7;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.pin{transition:r .25s}
.lbl{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;fill:#b9c6ce;transition:fill .25s}
.lbl.on{fill:#fff}
</style></head><body>
<svg id="m"></svg>
<script>
// Pins come from the Studio's Locations collection, embedded beside this frame by the page.
const offsets={Calabar:[14,16],Abuja:[14,-8],Warri:[-14,4,'end'],Uyo:[-14,18,'end'],Makurdi:[14,4],Maiduguri:[-14,-12,'end']};
const fallbackSites=[
 {k:'Cross River',city:'Calabar',c:[8.32,4.95],type:'Depot',route:false},{k:'FCT Abuja',city:'Abuja',c:[7.49,9.06],route:true},{k:'Delta',city:'Warri',c:[5.75,5.52],route:true},
 {k:'Akwa Ibom',city:'Uyo',c:[7.93,5.03],route:true},{k:'Benue',city:'Makurdi',c:[8.54,7.73],route:true},{k:'Borno',city:'Maiduguri',c:[13.15,11.83],route:true}
];
let embedded=null;
try{const host=window.frameElement&&window.frameElement.parentElement.querySelector('[data-map-sites]');if(host)embedded=JSON.parse(host.textContent);}catch(e){}
const raw=Array.isArray(embedded)&&embedded.length?embedded:fallbackSites;
const depotIndex=Math.max(0,raw.findIndex(s=>s.type==='Depot'));
const sites=raw.map((s,i)=>{const o=offsets[s.city]||(s.c[0]<raw[depotIndex].c[0]-1?[-14,4,'end']:[14,4]);return Object.assign({},s,{depot:i===depotIndex,dx:o[0],dy:o[1],anchor:o[2]||'start'});});
let active=null;
const svg=d3.select('#m');
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r=>r.json()).then(topo=>{
 const all=topojson.feature(topo,topo.objects.countries).features;
 const ng=all.find(f=>+f.id===566);
 function draw(){
  const w=innerWidth,h=innerHeight;svg.selectAll('*').remove();
  const proj=d3.geoMercator().fitExtent([[40,30],[w-40,h-30]],ng);const path=d3.geoPath(proj);
  const defs=svg.append('defs');
  const g=defs.append('linearGradient').attr('id','flame').attr('x1',0).attr('x2',1);
  g.append('stop').attr('offset','0%').attr('stop-color','#ffcc29');g.append('stop').attr('offset','100%').attr('stop-color','#ec3237');
  svg.append('g').selectAll('path').data(all.filter(f=>[204,562,148,120].includes(+f.id))).join('path').attr('d',path).attr('fill','#0a2236').attr('stroke','#163650').attr('stroke-width',.8);
  svg.append('path').datum(ng).attr('d',path).attr('fill','#0f2b42').attr('stroke','#e59b23').attr('stroke-opacity',.55).attr('stroke-width',1.2);
  const grat=d3.geoGraticule().step([2,2]);
  svg.append('path').datum(grat()).attr('d',path).attr('fill','none').attr('stroke','#ffffff').attr('stroke-opacity',.04).attr('clip-path',null);
  const depot=sites[depotIndex];const P=s=>proj(s.c);
  const routes=svg.append('g');
  sites.filter(s=>!s.depot&&s.route!==false).forEach(s=>{const a=P(depot),b=P(s);const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2-Math.hypot(b[0]-a[0],b[1]-a[1])*.22;
   routes.append('path').attr('d',`M${a[0]},${a[1]} Q${mx},${my} ${b[0]},${b[1]}`).attr('fill','none').attr('stroke','url(#flame)').attr('stroke-width',1.6).attr('class','flow').attr('data-k',s.k).attr('opacity',.85);});
  const pins=svg.append('g').selectAll('g').data(sites).join('g').attr('transform',s=>`translate(${P(s)})`);
  pins.append('circle').attr('class','ring').attr('r',s=>s.depot?10:6).attr('fill','none').attr('stroke','#e59b23').attr('stroke-width',1.2);
  pins.append('circle').attr('class','pin').attr('r',s=>s.depot?7:4.5).attr('fill',s=>s.depot?'#ffcc29':'#e59b23').attr('stroke','#031522').attr('stroke-width',2);
  pins.append('text').attr('class','lbl').attr('x',s=>s.dx).attr('y',s=>s.dy).attr('text-anchor',s=>s.anchor||'start').text(s=>s.depot?s.city+' · Depot':s.city);
  update();
 }
 function update(){
  svg.selectAll('.pin').attr('r',s=>(s.depot?7:4.5)*(active===s.k?1.7:1));
  svg.selectAll('.lbl').classed('on',s=>!active||active===s.k);
  svg.selectAll('.flow').attr('opacity',function(){return !active||this.dataset.k===active?.9:.15});
 }
 addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data&&'highlight'in e.data){active=e.data.highlight;update();}});
 addEventListener('resize',draw);draw();
});
</script>
</body></html>
